<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="sunFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF0080" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050510" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DFD8"/>
      <stop offset="100%" stop-color="#0070F3"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#050510"/>
  
  <!-- Coordinate Grid -->
  <g stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4,8">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Orbital Ellipse -->
  <ellipse cx="960" cy="540" rx="720" ry="380" fill="none" stroke="#2a2a4e" stroke-width="3"/>

  <!-- Tangential Escape Velocity Vector -->
  <line x1="960" y1="160" x2="1750" y2="160" stroke="url(#vectorGrad)" stroke-width="6" stroke-dasharray="16,8"/>
  <polygon points="1750,150 1780,160 1750,170" fill="#00DFD8"/>

  <!-- Ghost Sun Position Marker -->
  <circle cx="960" cy="540" r="140" fill="url(#sunFade)"/>
  <circle cx="960" cy="540" r="40" fill="none" stroke="#FF5500" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Earth Orbital Marker -->
  <circle cx="960" cy="160" r="28" fill="#00AAFF"/>
  <circle cx="960" cy="160" r="38" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Telemetry Text Readouts -->
  <text x="1000" y="140" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" fill="#00DFD8">
    V = 29.78 KM/S [TANGENTIAL MOMENTUM]
  </text>
  <text x="1000" y="210" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8888AA">
    GRAVITATIONAL WAVE FRONT: DELAY 500.0s // ESCAPE ANGLE: 0.00°
  </text>
</svg>