name: Cloud Video Rendering Engine

on:
  workflow_dispatch:
    inputs:
      projectId:
        description: 'Project ID to render'
        required: true
        default: 'what-happens-if-the-sun-disapp-mvz0tfzr'
      compositionId:
        description: 'Remotion Composition ID (VoxShort or VoxVideo)'
        required: true
        default: 'VoxShort'
      codec:
        description: 'Video Codec (h264 or prores)'
        required: true
        default: 'h264'

jobs:
  render:
    name: Production Cloud Video Render
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🔒 Human Approval & Workflow Security Gate
        run: |
          PROJECT_ID="${{ github.event.inputs.projectId || 'what-happens-if-the-sun-disapp-mvz0tfzr' }}"
          STATE_FILE="projects/${PROJECT_ID}/state.json"
          REPORT_FILE="projects/${PROJECT_ID}/production-report.json"

          echo "🔍 Evaluating human approval status for project: ${PROJECT_ID}..."
          
          if [ ! -f "$STATE_FILE" ]; then
            echo "❌ SECURITY ERROR: State file missing at $STATE_FILE"
            exit 1
          fi

          if [ ! -f "$REPORT_FILE" ]; then
            echo "❌ SECURITY ERROR: Production report missing at $REPORT_FILE"
            exit 1
          fi

          STATE=$(node -e "const fs = require('fs'); const s = JSON.parse(fs.readFileSync('$STATE_FILE', 'utf8')); console.log(s.state || '');")
          REPORT_STATUS=$(node -e "const fs = require('fs'); const r = JSON.parse(fs.readFileSync('$REPORT_FILE', 'utf8')); console.log(r.currentStatus || '');")

          echo "📋 Current state.json: state = ${STATE}"
          echo "📋 Current production-report.json: status = ${REPORT_STATUS}"

          if [ "$STATE" != "APPROVED" ] || [ "$REPORT_STATUS" != "APPROVED" ]; then
            echo "❌ SECURITY GATE REJECTED: Project ${PROJECT_ID} has not been approved by a human creator."
            echo "Direct rendering of unapproved or in-progress projects is strictly prohibited."
            exit 1
          fi

          echo "✅ Security Gate Passed: Project ${PROJECT_ID} is formally APPROVED for cloud rendering."

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🎥 Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 🧪 Pre-Flight Build & Test Suite Verification
        run: |
          npm run build
          npm test

      - name: 🎬 Fetch Real NASA 4K/HD Scientific Footage
        run: |
          mkdir -p public/assets
          echo "📥 Downloading real NASA scientific footage..."
          curl -s -L "https://svs.gsfc.nasa.gov/vis/a010000/a014100/a014126/New_Trebuchet_mkII.mp4" -o raw_sun.mp4
          curl -s -L "https://svs.gsfc.nasa.gov/vis/a000000/a005500/a005570/Earth_wAtmos_spin_02_1080p60.mp4" -o raw_earth.mp4
          curl -s -L "https://svs.gsfc.nasa.gov/vis/a010000/a013900/a013904/13904_DEEP_IGTV_MP4.mp4" -o raw_void.mp4

          echo "⚙️ Trimming and scaling to 1080x1920 @ 60fps vertical clips..."
          ffmpeg -y -ss 00:00:02 -t 00:00:08 -i raw_sun.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=60" -c:v libx264 -pix_fmt yuv420p -an public/assets/sun_broll.mp4
          ffmpeg -y -ss 00:00:00 -t 00:00:08 -i raw_earth.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=60" -c:v libx264 -pix_fmt yuv420p -an public/assets/earth_broll.mp4
          ffmpeg -y -ss 00:00:05 -t 00:00:09 -i raw_void.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=60" -c:v libx264 -pix_fmt yuv420p -an public/assets/void_broll.mp4
          ls -lh public/assets/

      - name: 🎬 Render Remotion Video (16GB RAM Cloud Runner)
        run: |
          mkdir -p out
          COMPOSITION="${{ github.event.inputs.compositionId || 'VoxShort' }}"
          CODEC="${{ github.event.inputs.codec || 'h264' }}"
          echo "Rendering composition: $COMPOSITION with codec: $CODEC..."
          npx remotion render src/index.ts "$COMPOSITION" out/video.mp4 --codec "$CODEC" --crf 17 --scale 1

      - name: 🔍 Post-Render Media Integrity & Stream Verification
        run: |
          echo "Inspecting rendered video container with FFprobe..."
          ffprobe -v error -show_format -show_streams -of json out/video.mp4 > out/probe.json
          cat out/probe.json
          
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/video.mp4)
          echo "✅ Rendered MP4 Duration: ${DURATION}s"

      - name: 🚀 Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vox-rendered-video-1080p
          path: out/video.mp4
          retention-days: 7
